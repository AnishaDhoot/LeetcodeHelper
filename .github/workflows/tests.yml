name: CodeCoach Test Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run Backend Tests & Coverage
        env:
          PYTHONPATH: .
          AI_DAILY_QUOTA_LIMIT: 50
        run: |
          pytest backend/tests backend/test_api.py -v --cov=backend --cov-report=term-missing

  frontend-tests:
    name: Frontend & Extension Test Suite (Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: extension
        run: npm ci

      - name: Run Frontend & Extension Tests
        working-directory: extension
        run: npm test

      - name: Build Extension Bundle
        working-directory: extension
        run: npm run build
